<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Recipe</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121215;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #98989f;
            --accent-color: #2997ff;
            --accent-soft: rgba(41, 151, 255, 0.15);
            --border-radius: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            max-width: 460px;
            margin: 0 auto;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* 画面全体のビューコンテナ（スワイプ切り替え用） */
        .views-container {
            display: flex;
            width: 200%;
            flex: 1;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 20px;
        }

        .view-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            padding-right: 10px;
            padding-left: 10px;
        }
        .view-panel:first-child { padding-left: 0; }
        .view-panel:last-child { padding-right: 0; }

        /* メインディスプレイカード */
        .main-display {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 32px 26px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 22px;
            gap: 12px;
        }

        .media-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .media-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .media-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .volume-badge {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-color);
            background: var(--accent-soft);
            padding: 8px 16px;
            border-radius: 22px;
            letter-spacing: -0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 組成リスト */
        .ingredient-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: 380px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .ing-name {
            color: #e5e5ea;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .ing-amount-wrapper {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .ing-amount {
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .ing-unit {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ページインジケーター（ドット） */
        .pagination-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: var(--accent-color);
        }

        /* 下部トリガーコントロールバー */
        .control-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }

        .trigger-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            border-radius: 20px;
            padding: 20px 22px;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .trigger-btn:active {
            transform: scale(0.97);
            background-color: #1c1c20;
        }

        .trigger-btn .arrow-icon {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        /* モーダルオーバーレイ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100%;
            max-width: 460px;
            background-color: #16161a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px 32px 0 0;
            padding: 28px 24px 50px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 75vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background-color: #222228;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 22px;
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-item:active {
            transform: scale(0.98);
        }

        .option-item.selected {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(41, 151, 255, 0.3);
        }

        .volume-grid-modal {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
    </style>
</head>
<body id="bodyTag">

    <div class="views-container" id="viewsContainer">
        
        <div class="view-panel">
            <div class="main-display">
                <div class="display-header">
                    <div class="media-title-wrapper">
                        <span class="media-eyebrow">Medium Recipe</span>
                        <h1 class="media-title" id="displayMediaName">培地名</h1>
                    </div>
                    <span class="volume-badge" id="displayVolume">100 mL</span>
                </div>
                <ul class="ingredient-list" id="ingredientList"></ul>
            </div>
        </div>

        <div class="view-panel">
            <div class="main-display">
                <div class="display-header">
                    <div class="media-title-wrapper">
                        <span class="media-eyebrow">PCR Master Mix</span>
                        <h1 class="media-title" id="displayPcrName">PCR酵素</h1>
                    </div>
                    <span class="volume-badge" id="displayPcrVolume">50 µL</span>
                </div>
                <ul class="ingredient-list" id="pcrIngredientList"></ul>
            </div>
        </div>

    </div>

    <div class="pagination-dots">
        <div class="dot active" id="dot0"></div>
        <div class="dot" id="dot1"></div>
    </div>

    <div class="control-bar" id="controlBar">
        </div>

    <div class="modal-overlay" id="mediaModal" onclick="outsideClose(event, 'mediaModal')">
        <div class="modal-content">
            <div class="modal-header">培地を選択</div>
            <div class="option-list" id="mediaOptionsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="volumeModal" onclick="outsideClose(event, 'volumeModal')">
        <div class="modal-content">
            <div class="modal-header">作製容量を選択</div>
            <div class="option-list volume-grid-modal" id="volumeOptionsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="pcrModal" onclick="outsideClose(event, 'pcrModal')">
        <div class="modal-content">
            <div class="modal-header">PCR酵素を選択</div>
            <div class="option-list" id="pcrOptionsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="pcrVolumeModal" onclick="outsideClose(event, 'pcrVolumeModal')">
        <div class="modal-content">
            <div class="modal-header">反応液量を選択</div>
            <div class="option-list volume-grid-modal" id="pcrVolumeOptionsList"></div>
        </div>
    </div>

    <script>
        // 培地データベース (100mL基準)
        const mediaDatabase = {
            "cm": {
                name: "CM培地",
                baseVolume: 100,
                ingredients: [
                    { name: "グルコース", amount: 1.0, unit: "g" },
                    { name: "Yeast extract", amount: 0.1, unit: "g" },
                    { name: "Tryptone", amount: 0.1, unit: "g" },
                    { name: "Solution A", amount: 1.0, unit: "mL" },
                    { name: "Solution B", amount: 1.0, unit: "mL" },
                    { name: "寒天", amount: 1.5, unit: "g" },
                    { name: "蒸留水", amount: 96.4, unit: "mL" }
                ]
            },
            "v30": {
                name: "V30培地",
                baseVolume: 100,
                ingredients: [
                    { name: "V30ジュース", amount: 16.0, unit: "mL" },
                    { name: "CaCO3", amount: 0.2, unit: "g" },
                    { name: "寒天", amount: 1.5, unit: "g" },
                    { name: "水", amount: 84.0, unit: "mL" }
                ]
            },
            "pda": {
                name: "PDA培地",
                baseVolume: 100,
                ingredients: [
                    { name: "PDA (粉)", amount: 3.9, unit: "g" },
                    { name: "水", amount: 100.0, unit: "mL" }
                ]
            },
            "lb": {
                name: "LB培地",
                baseVolume: 100,
                ingredients: [
                    { name: "LB (粉)", amount: 2.0, unit: "g" },
                    { name: "寒天", amount: 1.5, unit: "g" },
                    { name: "水", amount: 100.0, unit: "mL" }
                ]
            }
        };

        // PCR酵素データベース (50uL反応液あたりの標準的な構成比率を例として定義)
        const pcrDatabase = {
            "taq": {
                name: "Taq ポリメラーゼ",
                baseVolume: 50,
                ingredients: [
                    { name: "10x Buffer", amount: 5.0, unit: "µL" },
                    { name: "dNTPs (2 mM each)", amount: 5.0, unit: "µL" },
                    { name: "Forward Primer (10 µM)", amount: 1.0, unit: "µL" },
                    { name: "Reverse Primer (10 µM)", amount: 1.0, unit: "µL" },
                    { name: "Taq Polymerase", amount: 0.5, unit: "µL" },
                    { name: "Template DNA", amount: 1.0, unit: "µL" },
                    { name: "滅菌水 (dH2O)", amount: 36.5, unit: "µL" }
                ]
            },
            "prime_star": {
                name: "PrimeSTAR GXL",
                baseVolume: 50,
                ingredients: [
                    { name: "5x PrimeSTAR Buffer", amount: 10.0, unit: "µL" },
                    { name: "dNTPs (2.5 mM each)", amount: 4.0, unit: "µL" },
                    { name: "Forward Primer (10 µM)", amount: 1.0, unit: "µL" },
                    { name: "Reverse Primer (10 µM)", amount: 1.0, unit: "µL" },
                    { name: "PrimeSTAR GXL DNA Pol.", amount: 1.0, unit: "µL" },
                    { name: "Template DNA", amount: 1.0, unit: "µL" },
                    { name: "滅菌水 (dH2O)", amount: 32.0, unit: "µL" }
                ]
            }
        };

        let currentViewIndex = 0; // 0: 培地, 1: PCR
        let currentMediaKey = "cm";
        let currentVolume = 100;
        const mediaVolumes = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500];

        let currentPcrKey = "taq";
        let currentPcrVolume = 50;
        // 50から250まで10単位
        const pcrVolumes = [];
        for(let v = 50; v <= 250; v += 10) {
            pcrVolumes.push(v);
        }

        // タッチ・スワイプ管理変数
        let touchStartX = 0;
        let touchEndX = 0;

        function initApp() {
            // 培地モーダルリスト構築
            const mediaListEl = document.getElementById("mediaOptionsList");
            for (const key in mediaDatabase) {
                const btn = document.createElement("button");
                btn.className = `option-item ${key === currentMediaKey ? 'selected' : ''}`;
                btn.textContent = mediaDatabase[key].name;
                btn.onclick = () => {
                    currentMediaKey = key;
                    closeModal('mediaModal');
                    updateView();
                };
                mediaListEl.appendChild(btn);
            }

            // 培地容量モーダルリスト構築
            const volListEl = document.getElementById("volumeOptionsList");
            mediaVolumes.forEach(vol => {
                const btn = document.createElement("button");
                btn.className = `option-item ${vol === currentVolume ? 'selected' : ''}`;
                btn.textContent = `${vol} mL`;
                btn.onclick = () => {
                    currentVolume = vol;
                    closeModal('volumeModal');
                    updateView();
                };
                volListEl.appendChild(btn);
            });

            // PCR酵素モーダルリスト構築
            const pcrListEl = document.getElementById("pcrOptionsList");
            for (const key in pcrDatabase) {
                const btn = document.createElement("button");
                btn.className = `option-item ${key === currentPcrKey ? 'selected' : ''}`;
                btn.textContent = pcrDatabase[key].name;
                btn.onclick = () => {
                    currentPcrKey = key;
                    closeModal('pcrModal');
                    updateView();
                };
                pcrListEl.appendChild(btn);
            }

            // PCR反応液量モーダルリスト構築 (50〜250, 10刻み)
            const pcrVolListEl = document.getElementById("pcrVolumeOptionsList");
            pcrVolumes.forEach(vol => {
                const btn = document.createElement("button");
                btn.className = `option-item ${vol === currentPcrVolume ? 'selected' : ''}`;
                btn.textContent = `${vol} µL`;
                btn.onclick = () => {
                    currentPcrVolume = vol;
                    closeModal('pcrVolumeModal');
                    updateView();
                };
                pcrVolListEl.appendChild(btn);
            });

            setupSwipeListeners();
            updateView();
        }

        // スワイプ機能の実装
        function setupSwipeListeners() {
            const container = document.getElementById("viewsContainer");

            container.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            container.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});
        }

        function handleSwipe() {
            const threshold = 50; // スワイプ判定のしきい値
            if (touchEndX < touchStartX - threshold) {
                // 左スワイプ -> PCR画面へ
                switchToView(1);
            } else if (touchEndX > touchStartX + threshold) {
                // 右スワイプ -> 培地画面へ
                switchToView(0);
            }
        }

        function switchToView(index) {
            currentViewIndex = index;
            const container = document.getElementById("viewsContainer");
            container.style.transform = `translateX(-${index * 50}%)`;

            // ドット更新
            document.getElementById("dot0").classList.toggle('active', index === 0);
            document.getElementById("dot1").classList.toggle('active', index === 1);

            updateControlBar();
        }

        function updateControlBar() {
            const bar = document.getElementById("controlBar");
            bar.innerHTML = "";

            if (currentViewIndex === 0) {
                bar.innerHTML = `
                    <button class="trigger-btn" onclick="openModal('mediaModal')">
                        <span id="currentMediaLabel" style="font-weight: 700;">${mediaDatabase[currentMediaKey].name}</span>
                        <span class="arrow-icon">▾</span>
                    </button>
                    <button class="trigger-btn" onclick="openModal('volumeModal')">
                        <span id="currentVolumeLabel" style="font-weight: 700;">${currentVolume} mL</span>
                        <span class="arrow-icon">▾</span>
                    </button>
                `;
            } else {
                bar.innerHTML = `
                    <button class="trigger-btn" onclick="openModal('pcrModal')">
                        <span id="currentPcrLabel" style="font-weight: 700; font-size: 14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${pcrDatabase[currentPcrKey].name}</span>
                        <span class="arrow-icon">▾</span>
                    </button>
                    <button class="trigger-btn" onclick="openModal('pcrVolumeModal')">
                        <span id="currentPcrVolumeLabel" style="font-weight: 700;">${currentPcrVolume} µL</span>
                        <span class="arrow-icon">▾</span>
                    </button>
                `;
            }
        }

        function updateView() {
            // 1. 培地ビューの計算・描画
            const media = mediaDatabase[currentMediaKey];
            document.getElementById("displayMediaName").textContent = media.name;
            document.getElementById("displayVolume").textContent = `${currentVolume} mL`;

            // モーダルの選択状態ハイライト
            document.querySelectorAll("#mediaOptionsList .option-item").forEach(el => {
                el.classList.toggle('selected', el.textContent === media.name);
            });
            document.querySelectorAll("#volumeOptionsList .option-item").forEach(el => {
                el.classList.toggle('selected', el.textContent === `${currentVolume} mL`);
            });

            const listContainer = document.getElementById("ingredientList");
            listContainer.innerHTML = "";
            const ratio = currentVolume / media.baseVolume;

            media.ingredients.forEach(ing => {
                const calcAmount = ing.amount * ratio;
                const formatted = calcAmount >= 10 
                    ? calcAmount.toFixed(1) 
                    : calcAmount.toFixed(2).replace(/\.?0+$/, "");

                const li = document.createElement("li");
                li.className = "ingredient-item";
                li.innerHTML = `
                    <span class="ing-name">${ing.name}</span>
                    <div class="ing-amount-wrapper">
                        <span class="ing-amount">${formatted}</span>
                        <span class="ing-unit">${ing.unit}</span>
                    </div>
                `;
                listContainer.appendChild(li);
            });

            // 2. PCRビューの計算・描画
            const pcr = pcrDatabase[currentPcrKey];
            document.getElementById("displayPcrName").textContent = pcr.name;
            document.getElementById("displayPcrVolume").textContent = `${currentPcrVolume} µL`;

            document.querySelectorAll("#pcrOptionsList .option-item").forEach(el => {
                el.classList.toggle('selected', el.textContent === pcr.name);
            });
            document.querySelectorAll("#pcrVolumeOptionsList .option-item").forEach(el => {
                el.classList.toggle('selected', el.textContent === `${currentPcrVolume} µL`);
            });

            const pcrListContainer = document.getElementById("pcrIngredientList");
            pcrListContainer.innerHTML = "";
            const pcrRatio = currentPcrVolume / pcr.baseVolume;

            pcr.ingredients.forEach(ing => {
                const calcAmount = ing.amount * pcrRatio;
                const formatted = calcAmount >= 10 
                    ? calcAmount.toFixed(1) 
                    : calcAmount.toFixed(2).replace(/\.?0+$/, "");

                const li = document.createElement("li");
                li.className = "ingredient-item";
                li.innerHTML = `
                    <span class="ing-name">${ing.name}</span>
                    <div class="ing-amount-wrapper">
                        <span class="ing-amount">${formatted}</span>
                        <span class="ing-unit">${ing.unit}</span>
                    </div>
                `;
                pcrListContainer.appendChild(li);
            });

            updateControlBar();
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add("active");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove("active");
        }

        function outsideClose(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
