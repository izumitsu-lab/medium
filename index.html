<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Recipe</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121215;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #98989f;
            --accent-color: #2997ff;
            --accent-soft: rgba(41, 151, 255, 0.15);
            --border-radius: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            max-width: 460px;
            margin: 0 auto;
            justify-content: space-between;
        }

        /* 画面上部：メインディスプレイ */
        .main-display {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 32px 26px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 22px;
            gap: 12px;
        }

        .media-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .media-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .media-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .volume-badge {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-color);
            background: var(--accent-soft);
            padding: 8px 16px;
            border-radius: 22px;
            letter-spacing: -0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 組成リスト */
        .ingredient-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .ing-name {
            color: #e5e5ea;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .ing-amount-wrapper {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .ing-amount {
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .ing-unit {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* 下部トリガーコントロールバー */
        .control-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }

        .trigger-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            border-radius: 20px;
            padding: 20px 22px;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .trigger-btn:active {
            transform: scale(0.97);
            background-color: #1c1c20;
        }

        .trigger-btn .arrow-icon {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        /* モーダルオーバーレイ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* モーダルコンテンツ */
        .modal-content {
            width: 100%;
            max-width: 460px;
            background-color: #16161a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px 32px 0 0;
            padding: 28px 24px 50px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 75vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 選択肢リスト */
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background-color: #222228;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 22px;
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-item:active {
            transform: scale(0.98);
        }

        .option-item.selected {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(41, 151, 255, 0.3);
        }

        .volume-grid-modal {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="main-display">
        <div class="display-header">
            <div class="media-title-wrapper">
                <span class="media-eyebrow">Medium</span>
                <h1 class="media-title" id="displayMediaName">培地名</h1>
            </div>
            <span class="volume-badge" id="displayVolume">100 mL</span>
        </div>
        <ul class="ingredient-list" id="ingredientList">
            </ul>
    </div>

    <div class="control-bar">
        <button class="trigger-btn" onclick="openModal('mediaModal')">
            <span id="currentMediaLabel" style="font-weight: 700;">培地</span>
            <span class="arrow-icon">▾</span>
        </button>
        <button class="trigger-btn" onclick="openModal('volumeModal')">
            <span id="currentVolumeLabel" style="font-weight: 700;">容量</span>
            <span class="arrow-icon">▾</span>
        </button>
    </div>

    <div class="modal-overlay" id="mediaModal" onclick="outsideClose(event, 'mediaModal')">
        <div class="modal-content">
            <div class="modal-header">培地を選択</div>
            <div class="option-list" id="mediaOptionsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="volumeModal" onclick="outsideClose(event, 'volumeModal')">
        <div class="modal-content">
            <div class="modal-header">作製容量を選択</div>
            <div class="option-list volume-grid-modal" id="volumeOptionsList"></div>
        </div>
    </div>

    <script>
        const mediaDatabase = {
            "cm_agar": {
                name: "CM培地（寒天）",
                baseVolume: 100,
                ingredients: [
                    { name: "グルコース", amount: 1.0, unit: "g" },
                    { name: "Yeast extract", amount: 0.1, unit: "g" },
                    { name: "Tryptone", amount: 0.1, unit: "g" },
                    { name: "Solution A", amount: 1.0, unit: "mL" },
                    { name: "Solution B", amount: 1.0, unit: "mL" },
                    { name: "寒天", amount: 1.5, unit: "g" },
                    { name: "蒸留水", amount: 96.4, unit: "mL" }
                ]
            },
            "cm_liquid": {
                name: "CM液体培地",
                baseVolume: 100,
                ingredients: [
                    { name: "グルコース", amount: 1.0, unit: "g" },
                    { name: "Yeast extract", amount: 0.1, unit: "g" },
                    { name: "Tryptone", amount: 0.1, unit: "g" },
                    { name: "Solution A", amount: 1.0, unit: "mL" },
                    { name: "Solution B", amount: 1.0, unit: "mL" },
                    { name: "蒸留水", amount: 97.8, unit: "mL" }
                ]
            },
            "v30_agar": {
                name: "V30培地（寒天）",
                baseVolume: 100,
                ingredients: [
                    { name: "V30ジュース", amount: 16.0, unit: "mL" },
                    { name: "CaCO3", amount: 0.2, unit: "g" },
                    { name: "寒天", amount: 1.5, unit: "g" },
                    { name: "水", amount: 84.0, unit: "mL" }
                ]
            },
            "pda_agar": {
                name: "PDA培地（寒天）",
                baseVolume: 100,
                ingredients: [
                    { name: "PDA (粉)", amount: 3.9, unit: "g" },
                    { name: "水", amount: 100.0, unit: "mL" }
                ]
            },
            "lb_agar": {
                name: "LB培地（寒天）",
                baseVolume: 100,
                ingredients: [
                    { name: "LB (粉)", amount: 2.0, unit: "g" },
                    { name: "寒天", amount: 1.5, unit: "g" },
                    { name: "水", amount: 100.0, unit: "mL" }
                ]
            }
        };

        let currentMediaKey = "cm_agar";
        let currentVolume = 100;
        const volumes = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500];

        function initApp() {
            const mediaListEl = document.getElementById("mediaOptionsList");
            for (const key in mediaDatabase) {
                const btn = document.createElement("button");
                btn.className = `option-item ${key === currentMediaKey ? 'selected' : ''}`;
                btn.textContent = mediaDatabase[key].name;
                btn.onclick = () => {
                    currentMediaKey = key;
                    closeModal('mediaModal');
                    updateView();
                };
                mediaListEl.appendChild(btn);
            }

            const volListEl = document.getElementById("volumeOptionsList");
            volumes.forEach(vol => {
                const btn = document.createElement("button");
                btn.className = `option-item ${vol === currentVolume ? 'selected' : ''}`;
                btn.textContent = `${vol} mL`;
                btn.onclick = () => {
                    currentVolume = vol;
                    closeModal('volumeModal');
                    updateView();
                };
                volListEl.appendChild(btn);
            });

            updateView();
        }

        function updateView() {
            const media = mediaDatabase[currentMediaKey];

            document.getElementById("displayMediaName").textContent = media.name;
            document.getElementById("displayVolume").textContent = `${currentVolume} mL`;
            document.getElementById("currentMediaLabel").textContent = media.name;
            document.getElementById("currentVolumeLabel").textContent = `${currentVolume} mL`;

            document.querySelectorAll("#mediaOptionsList .option-item").forEach(el => {
                el.classList.toggle('selected', el.textContent === media.name);
            });
            document.querySelectorAll("#volumeOptionsList .option-item").forEach(el => {
                el.classList.toggle('selected', el.textContent === `${currentVolume} mL`);
            });

            const listContainer = document.getElementById("ingredientList");
            listContainer.innerHTML = "";
            const ratio = currentVolume / media.baseVolume;

            media.ingredients.forEach(ing => {
                const calcAmount = ing.amount * ratio;
                const formatted = calcAmount >= 10 
                    ? calcAmount.toFixed(1) 
                    : calcAmount.toFixed(2).replace(/\.?0+$/, "");

                const li = document.createElement("li");
                li.className = "ingredient-item";
                li.innerHTML = `
                    <span class="ing-name">${ing.name}</span>
                    <div class="ing-amount-wrapper">
                        <span class="ing-amount">${formatted}</span>
                        <span class="ing-unit">${ing.unit}</span>
                    </div>
                `;
                listContainer.appendChild(li);
            });
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add("active");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove("active");
        }

        function outsideClose(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
